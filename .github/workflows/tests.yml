name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

jobs:
  test:
    name: ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install (hash-checked)
        shell: bash
        run: |
          python -m pip install --require-hashes -r requirements/tests.txt
          python -m pip install --no-deps --no-build-isolation .
      - run: python -m pytest

  release-lock:
    # The release job's hash-locked install and build, on every push, so a
    # stale or broken lock shows here and not first on a tag.
    name: release lock / ubuntu / py3.12
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install --require-hashes -r requirements/release.txt
      - run: python -m build --no-isolation
      - run: python -m pip install --no-deps dist/*.whl
      - name: The installed wheel, not the checkout, is what imports
        run: python -P -c 'import routemap_engine as e, sys; print(e.__file__); sys.exit("site-packages" not in e.__file__)'
      - run: pytest

  probe:
    # The built-in ICMP prober, for real, on each platform's runner.
    name: probe / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install (hash-checked)
        shell: bash
        run: |
          python -m pip install --require-hashes -r requirements/tests.txt
          python -m pip install --no-deps --no-build-isolation .
      - name: A router in network namespaces (Linux)
        if: runner.os == 'Linux'
        run: |
          # Unprivileged ICMP sockets, as on most desktop distributions.
          sudo sysctl -w net.ipv4.ping_group_range="0 2147483647"
          sudo ip netns add rtr; sudo ip netns add tgt
          sudo ip link add h0 type veth peer name r0; sudo ip link set r0 netns rtr
          sudo ip link add r1 type veth peer name t0; sudo ip link set r1 netns rtr; sudo ip link set t0 netns tgt
          sudo ip addr add 10.77.0.1/24 dev h0; sudo ip link set h0 up
          sudo ip netns exec rtr ip addr add 10.77.0.2/24 dev r0
          sudo ip netns exec rtr ip addr add 10.77.1.1/24 dev r1
          sudo ip netns exec rtr ip link set r0 up; sudo ip netns exec rtr ip link set r1 up; sudo ip netns exec rtr ip link set lo up
          sudo ip netns exec rtr sysctl -w net.ipv4.ip_forward=1
          sudo ip netns exec tgt ip addr add 10.77.1.2/24 dev t0; sudo ip netns exec tgt ip link set t0 up
          sudo ip netns exec tgt ip link set lo up; sudo ip netns exec tgt ip route add default via 10.77.1.1
          sudo ip route add 10.77.1.0/24 via 10.77.0.2
          echo "ROUTEMAP_PROBE_TARGET=10.77.1.2" >> "$GITHUB_ENV"
          echo "ROUTEMAP_PROBE_ROUTER=10.77.0.2" >> "$GITHUB_ENV"
          echo "ROUTEMAP_PROBE_MIN_HOPS=2" >> "$GITHUB_ENV"
          echo "ROUTEMAP_PROBE_HOPS=4" >> "$GITHUB_ENV"
      - name: A per-flow load balancer in network namespaces (Linux; path discovery, IPv4 and IPv6)
        if: runner.os == 'Linux'
        run: |
          bash tests/helpers/paths_lab.sh
          # The TCP flow prober's lab check: a second adapter with tailnet-style
          # addresses (as on a machine running Tailscale), and a listener at the
          # target that logs who connects.
          sudo ip link add tsx0 type dummy && sudo ip link set tsx0 up
          sudo ip addr add 100.100.7.7/32 dev tsx0 && sudo ip addr add fd7a:115c:a1e0::7/128 dev tsx0
          touch /tmp/tcplab.log && chmod 666 /tmp/tcplab.log
          sudo ip netns exec ptg python3 tests/helpers/tcp_listener.py /tmp/tcplab.log 8443 &
          sleep 1
          echo "ROUTEMAP_TCP_LAB_LOG=/tmp/tcplab.log" >> "$GITHUB_ENV"
          echo "ROUTEMAP_PATHS_LAB=1" >> "$GITHUB_ENV"
          echo "ROUTEMAP_PROBE_TARGET6=fd78:9::9" >> "$GITHUB_ENV"
          echo "ROUTEMAP_PROBE_HOPS6=3" >> "$GITHUB_ENV"
      - name: The internet (macOS)
        if: runner.os == 'macOS'
        run: |
          echo "ROUTEMAP_PROBE_TARGET=heise.de" >> "$GITHUB_ENV"
          echo "ROUTEMAP_PROBE_MIN_HOPS=5" >> "$GITHUB_ENV"
          echo "ROUTEMAP_PATHS_TARGET=heise.de" >> "$GITHUB_ENV"
          echo "ROUTEMAP_PROBE_TARGET6=::1" >> "$GITHUB_ENV"
      - name: Loopback (Windows; the runner's network drops ICMP)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          echo "ROUTEMAP_PROBE_TARGET=127.0.0.1" >> "$GITHUB_ENV"
          echo "ROUTEMAP_PROBE_MIN_HOPS=1" >> "$GITHUB_ENV"
          echo "ROUTEMAP_PROBE_HOPS=3" >> "$GITHUB_ENV"
          echo "ROUTEMAP_PROBE_TARGET6=::1" >> "$GITHUB_ENV"
      - run: python -m pytest -q -s -rs tests/test_probe.py tests/test_probe_live6.py tests/test_multipath_live.py tests/test_tcp_lab_live.py
