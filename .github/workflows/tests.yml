name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest

  probe:
    # The built-in ICMP prober, for real, on each platform's runner.
    name: probe / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - name: A router in network namespaces (Linux)
        if: runner.os == 'Linux'
        run: |
          # Unprivileged ICMP sockets, as on most desktop distributions.
          sudo sysctl -w net.ipv4.ping_group_range="0 2147483647"
          sudo ip netns add rtr; sudo ip netns add tgt
          sudo ip link add h0 type veth peer name r0; sudo ip link set r0 netns rtr
          sudo ip link add r1 type veth peer name t0; sudo ip link set r1 netns rtr; sudo ip link set t0 netns tgt
          sudo ip addr add 10.77.0.1/24 dev h0; sudo ip link set h0 up
          sudo ip netns exec rtr ip addr add 10.77.0.2/24 dev r0
          sudo ip netns exec rtr ip addr add 10.77.1.1/24 dev r1
          sudo ip netns exec rtr ip link set r0 up; sudo ip netns exec rtr ip link set r1 up; sudo ip netns exec rtr ip link set lo up
          sudo ip netns exec rtr sysctl -w net.ipv4.ip_forward=1
          sudo ip netns exec tgt ip addr add 10.77.1.2/24 dev t0; sudo ip netns exec tgt ip link set t0 up
          sudo ip netns exec tgt ip link set lo up; sudo ip netns exec tgt ip route add default via 10.77.1.1
          sudo ip route add 10.77.1.0/24 via 10.77.0.2
          echo "ROUTEMAP_PROBE_TARGET=10.77.1.2" >> "$GITHUB_ENV"
          echo "ROUTEMAP_PROBE_ROUTER=10.77.0.2" >> "$GITHUB_ENV"
          echo "ROUTEMAP_PROBE_MIN_HOPS=2" >> "$GITHUB_ENV"
          echo "ROUTEMAP_PROBE_HOPS=4" >> "$GITHUB_ENV"
      - name: The internet (macOS)
        if: runner.os == 'macOS'
        run: |
          echo "ROUTEMAP_PROBE_TARGET=heise.de" >> "$GITHUB_ENV"
          echo "ROUTEMAP_PROBE_MIN_HOPS=5" >> "$GITHUB_ENV"
      - name: Loopback (Windows; the runner's network drops ICMP)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          echo "ROUTEMAP_PROBE_TARGET=127.0.0.1" >> "$GITHUB_ENV"
          echo "ROUTEMAP_PROBE_MIN_HOPS=1" >> "$GITHUB_ENV"
          echo "ROUTEMAP_PROBE_HOPS=3" >> "$GITHUB_ENV"
      - run: python -m pytest -q -s tests/test_probe.py
