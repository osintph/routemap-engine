# On a version tag: test, build the sdist and wheel, publish to PyPI by trusted
# publishing (no API token stored anywhere), and create the GitHub release.
#
# One-time setup on pypi.org (the project owner): Publishing > Add a pending
# publisher: project "routemap-engine", owner "osintph", repository
# "routemap-engine", workflow "release.yml", environment "pypi".
#
# Built from fixed inputs only: every action by commit, every package by hash
# from requirements/release.txt, and the build without an isolated environment
# (which would fetch its own, unpinned build backend).
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install --require-hashes -r requirements/release.txt
      - run: python -m pip install --no-deps --no-build-isolation -e .
      - run: python -m pytest
      - name: Version matches tag
        run: |
          V="$(python -c 'from routemap_engine.__about__ import __version__ as v; print(v)')"
          test "v$V" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME but version $V"; exit 1; }
      - run: python -m build --no-isolation
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/

  pypi:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  github-release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch --force origin "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
          TITLE="$(git tag -l --format='%(contents:subject)' "$GITHUB_REF_NAME")"
          gh release create "$GITHUB_REF_NAME" dist/* --title "${TITLE:-$GITHUB_REF_NAME}" \
            --notes "See CHANGELOG.md." --verify-tag
