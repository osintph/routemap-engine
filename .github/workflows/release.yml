# On a version tag: test, build the sdist and wheel, publish to PyPI by trusted
# publishing (no API token stored anywhere), and create the GitHub release.
#
# One-time setup on pypi.org (the project owner): Publishing > Add a pending
# publisher: project "routemap-engine", owner "osintph", repository
# "routemap-engine", workflow "release.yml", environment "pypi".
#
# Built from fixed inputs only: every action by commit, every package by hash
# from requirements/release.txt, and the build without an isolated environment
# (which would fetch its own, unpinned build backend). No editable install: its
# backend hook needs packages the lock does not hold.
#
# Each file gets build provenance (actions/attest-build-provenance), and the
# GitHub release carries a CycloneDX SBOM of release.txt (hardening 7); PyPI
# gets the sdist and wheel only, with its own attestations from trusted
# publishing.
name: release

on:
  push:
    tags: ["v*"]

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install --require-hashes -r requirements/release.txt
      # The sdist and wheel, built by the locked hatchling. The tests then run
      # against the installed wheel: the file that is published, not the tree.
      - run: python -m build --no-isolation
      - run: python -m pip install --no-deps dist/*.whl
      - name: The installed wheel, not the checkout, is what imports
        run: python -P -c 'import routemap_engine as e, sys; print(e.__file__); sys.exit("site-packages" not in e.__file__)'
      - run: pytest
      - name: Version matches tag
        run: |
          V="$(python -P -c 'from routemap_engine.__about__ import __version__ as v; print(v)')"
          test "v$V" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME but version $V"; exit 1; }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/

  sbom:
    # A CycloneDX SBOM of release.txt, in its own job so the build job's
    # installs stay exactly the lock and the wheel.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: pip-audit (hash-checked)
        run: python -m pip install --require-hashes -r requirements/audit.txt
      - name: CycloneDX SBOM of the release lock
        run: |
          mkdir sbom
          # Exit 1 means "known vulnerabilities listed in the SBOM"; anything else is a failure.
          code=0
          pip-audit --disable-pip --require-hashes --progress-spinner off -f cyclonedx-json \
            -r requirements/release.txt -o "sbom/routemap_engine-${GITHUB_REF_NAME#v}-sbom.cdx.json" || code=$?
          [ "$code" -le 1 ] || exit "$code"
          [ "$code" -eq 0 ] || echo "::warning::pip-audit lists known vulnerabilities in the SBOM"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom
          path: sbom/

  pypi:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  github-release:
    needs: [build, sbom]
    runs-on: ubuntu-latest
    permissions:
      contents: write       # the GitHub release
      id-token: write       # build provenance (Sigstore)
      attestations: write   # build provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sbom
          path: sbom/
      - name: Build provenance for the sdist, the wheel and the SBOM
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*
            sbom/*
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch --force origin "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
          TITLE="$(git tag -l --format='%(contents:subject)' "$GITHUB_REF_NAME")"
          gh release create "$GITHUB_REF_NAME" dist/* sbom/* --title "${TITLE:-$GITHUB_REF_NAME}" \
            --notes "See CHANGELOG.md." --verify-tag
