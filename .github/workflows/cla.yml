# The Contributor Licence Agreement (CLA.md), required on every pull request.
#
# The bot comments on a pull request whose authors have not signed, and a
# contributor signs by posting the exact sentence it gives. Signatures are kept
# in this repository on the "cla-signatures" branch (signatures/v1/cla.json),
# so no outside service holds them. The check this job reports, "CLA", is a
# required status check on main, so nothing merges without a signature.
#
# pull_request_target runs this workflow from main with write access; it never
# checks out or runs the pull request's code.
name: CLA

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, synchronize, reopened, closed]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    name: CLA
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'pull_request_target' ||
      (github.event.issue.pull_request &&
       (github.event.comment.body == 'recheck' ||
        github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'))
    steps:
      - uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-document: https://github.com/osintph/routemap-engine/blob/main/CLA.md
          path-to-signatures: signatures/v1/cla.json
          branch: cla-signatures
          allowlist: osintph,dependabot[bot],github-actions[bot]
          lock-pullrequest-aftermerge: false
          custom-notsigned-prcomment: >-
            Thank you for your pull request. Before it can be considered, each
            author needs to sign the [Contributor Licence Agreement](https://github.com/osintph/routemap-engine/blob/main/CLA.md)
            once, by posting the sentence below as a comment. Please also note
            that contributions may be declined (see CONTRIBUTING.md).
          custom-allsigned-prcomment: All authors have signed the CLA. Thank you.
