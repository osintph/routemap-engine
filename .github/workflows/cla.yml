# The Contributor Licence Agreement (CLA.md), required on every pull request.
#
# A pull request whose commit authors have not all signed gets a comment, and a
# contributor signs by posting the exact sentence it gives. Signatures are kept
# in this repository on the "cla-signatures" branch (signatures/v1/cla.json),
# so no outside service holds them. The verdict is a commit status named "CLA"
# on the pull request's head commit, a required check on main, so nothing
# merges without a signature. The logic is .github/scripts/cla.js, run with
# GitHub's own github-script action (the archived third-party CLA action it
# replaces is gone, RM-04), tested in tests/node/cla.test.js.
#
# pull_request_target runs this workflow from main with write access. It checks
# out only main's .github/scripts, never the pull request's code, and it has no
# right to start other workflows.
name: CLA

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, synchronize, reopened, closed]

permissions: {}

concurrency:
  group: cla-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: false

jobs:
  cla:
    # Not named "CLA": that name is the commit status the script sets.
    name: CLA check
    runs-on: ubuntu-24.04
    permissions:
      contents: write        # the signatures file on the cla-signatures branch
      pull-requests: write   # the comment on the pull request
      statuses: write        # the "CLA" status on the head commit
    if: >-
      github.event_name == 'pull_request_target' ||
      (github.event.issue.pull_request &&
       (github.event.comment.body == 'recheck' ||
        github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'))
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: .github/scripts
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const cla = require('./.github/scripts/cla.js');
            const verdict = await cla({ github, context,
              documentUrl: `https://github.com/${context.repo.owner}/${context.repo.repo}/blob/main/CLA.md` });
            core.info(`CLA: ${verdict}`);
