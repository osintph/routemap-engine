[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "routemap-engine"
dynamic = ["version"]
description = "Hostname-first, physics-checked traceroute geolocation: parsers, CAIDA Hoiho client, carrier site codes, RTT bound."
readme = "README.md"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "osintph", email = "sb@osintph.info" }]
keywords = ["traceroute", "geolocation", "osint", "network", "hoiho"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Information Technology",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Networking",
]
# Lower bounds, not pins: FalconEye pins its own httpx and dnspython.
dependencies = ["httpx>=0.27", "dnspython>=2.6.1"]

[project.optional-dependencies]
# DB-IP Lite City and ASN files (MaxMind DB format) for the offline tier.
offline = ["maxminddb>=2.5"]
dev = ["pytest>=8", "jsonschema>=4.20", "maxminddb>=2.5", "PyYAML"]

[project.scripts]
# The agent a Route Map app runs on a server over SSH (routemap_engine.agent).
routemap-engine = "routemap_engine.cli:main"

[project.urls]
Homepage = "https://github.com/osintph/routemap-engine"
Issues = "https://github.com/osintph/routemap-engine/issues"
Changelog = "https://github.com/osintph/routemap-engine/blob/main/CHANGELOG.md"

[tool.hatch.version]
path = "routemap_engine/__about__.py"

[tool.hatch.build.targets.sdist]
include = ["routemap_engine", "tests", "README.md", "CHANGELOG.md", "LICENSE"]

[tool.hatch.build.targets.wheel]
packages = ["routemap_engine"]

[tool.pytest.ini_options]
markers = ["real_pool: run continuous mode with its real thread pool"]
testpaths = ["tests"]
addopts = "-q"
